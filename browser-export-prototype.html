<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>VidsAI browser export prototype</title>
    </head>
    <body>
        <h1>Browser export prototype</h1>
        <p>Select the reference fixture folder to export its three-second project locally.</p>
        <label>Reference fixture folder <input id="fixture" type="file" webkitdirectory /></label>
        <button id="export" type="button" disabled>Export MP4</button>
        <button id="cancel" type="button" disabled>Cancel</button>
        <p id="status" role="status">Waiting for the fixture folder.</p>
        <a id="download" download="browser-reference.mp4" hidden>Download MP4</a>
        <script type="module" src="/resources/js/editor/browser-export/prototype.ts"></script>
    </body>
</html>
