name: TypeScript application checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  application:
    # Fork pull requests cannot read the private companion repository.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out application
        uses: actions/checkout@v7
        with:
          path: vidsAi
          persist-credentials: false
      - name: Check out private Remotion workers (read only)
        uses: actions/checkout@v7
        with:
          repository: fahdcf/remotion-api
          ref: d3f91b16d5bf877f58d19aa5226826151d6c4d4f
          ssh-key: ${{ secrets.REMOTION_CI_SSH_KEY }}
          persist-credentials: false
          path: remotion-api
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install worker dependencies
        run: npm ci
        working-directory: remotion-api
      - name: Check shared editing and worker code
        run: npm run build:shared && npm run typecheck && npm test
        working-directory: remotion-api
      - name: Install application dependencies
        run: npm ci
        working-directory: vidsAi
      - name: Check and build the complete TypeScript application
        run: npm run typecheck && npm run test:fresh && npm run build
        working-directory: vidsAi
