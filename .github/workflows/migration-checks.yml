name: TypeScript application checks
on: [push, pull_request, workflow_dispatch]
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: vidsAi
      - uses: actions/checkout@v4
        with:
          repository: fahdcf/remotion-api
          ref: migration/full-typescript
          token: ${{ secrets.REMOTION_REPO_TOKEN || github.token }}
          path: remotion-api
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
        working-directory: remotion-api
      - run: npm run build:shared && npm run typecheck && npm test
        working-directory: remotion-api
      - run: npm ci
        working-directory: vidsAi
      - run: npm run typecheck && npm test && npm run build
        working-directory: vidsAi
